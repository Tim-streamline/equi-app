<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Brand colours</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--canvas); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .swatch { border-radius: 16px; padding: 20px; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-sm); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.02em; }
  .codes { display: flex; flex-direction: column; gap: 2px; font-size: 12px; line-height: 1.4; opacity: 0.85; font-feature-settings: 'tnum'; }
  .mint { background: var(--mint); color: white; }
  .deep { background: var(--blue-green); color: white; }
</style>
</head>
<body>
  <div class="swatch mint">
    <div class="name">Mint</div>
    <div class="codes">
      <div>HEX&nbsp;&nbsp;&nbsp;#18BAB0</div>
      <div>RGB&nbsp;&nbsp;&nbsp;24 · 186 · 176</div>
      <div>CMYK&nbsp;&nbsp;72 · 0 · 39 · 0</div>
    </div>
  </div>
  <div class="swatch deep">
    <div class="name">Blue-green</div>
    <div class="codes">
      <div>HEX&nbsp;&nbsp;&nbsp;#127A79</div>
      <div>RGB&nbsp;&nbsp;&nbsp;18 · 122 · 121</div>
      <div>CMYK&nbsp;&nbsp;84 · 29 · 49 · 15</div>
    </div>
  </div>
</body>
</html>
