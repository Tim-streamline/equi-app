<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Testimonial</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--mint-50); display: flex; align-items: center; }
  .q {
    background: var(--canvas);
    border-radius: 24px; padding: 24px 28px;
    box-shadow: var(--shadow-md);
    border-top: 6px solid var(--mint);
    max-width: 100%;
  }
  .q-mark { font-family: var(--font-display); font-style: italic; color: var(--mint-300); font-size: 64px; line-height: 0.6; margin-bottom: 6px; }
  .q-text { font-family: var(--font-display); font-style: italic; font-weight: 600; color: var(--blue-green); font-size: 22px; line-height: 1.4; }
  .q-attr { margin-top: 14px; font-size: 13px; color: var(--ink-70); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
  <div class="q">
    <div class="q-mark">"</div>
    <div class="q-text">Naast dat ze rustig en vriendelijk te werk gaat, leveren haar behandelingen ook <em>écht</em> resultaat.</div>
    <div class="q-attr">— Lisanne · merrie Pink Lady</div>
  </div>
</body>
</html>
