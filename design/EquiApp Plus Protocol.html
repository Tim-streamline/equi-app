document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

53, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #EFE8DE; font-family: 'Source Sans 3', system-ui, sans-serif; color: #1B2A2A; -webkit-font-smoothing: antialiased; }\n  a { color: #127A79; text-decoration: none; }\n  a:hover { color: #108A82; }\n  * { box-sizing: border-box; }\n  ::-webkit-scrollbar { width: 0; height: 0; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display: flex; gap: 56px; align-items: flex-start; justify-content: center; padding: 56px 40px 80px; min-height: 100vh; background: #EFE8DE;\">\n\n  <div style=\"width: 300px; padding-top: 28px; display: flex; flex-direction: column; gap: 28px;\">\n    <div>\n      <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #108A82; margin-bottom: 10px;\">EquiApp · Plus-abonnement<\u002Fdiv>\n      <div style=\"font-family: 'Source Sans 3'; font-weight: 600; font-size: 34px; line-height: 1.1; letter-spacing: 0.02em; color: #127A79; text-transform: uppercase;\">Het protocol<br>van jouw paard<\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.6; color: rgba(27,42,42,0.7); margin: 14px 0 0;\">Het volledige adviesdocument wordt één dagelijkse lijst. De app rekent zelf uit welke stap actief is en welke dosering vandaag geldt, de rest van het schema blijft uit beeld.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 999px; background: #C9F3EE; color: #0E6F69; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;\">1<\u002Fdiv>\n        <div><div style=\"font-weight: 600; font-size: 14.5px;\">Vandaag is de startpagina<\u002Fdiv><div style=\"font-size: 13.5px; line-height: 1.5; color: rgba(27,42,42,0.6);\">Alleen wat vandaag gegeven wordt, met de dosering van vandaag. Opbouwweken rekent de app door.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 999px; background: #C9F3EE; color: #0E6F69; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;\">2<\u002Fdiv>\n        <div><div style=\"font-weight: 600; font-size: 14.5px;\">Kalender bewaakt de trouw<\u002Fdiv><div style=\"font-size: 13.5px; line-height: 1.5; color: rgba(27,42,42,0.6);\">Niet-afgevinkte dagen kleuren oranje. Na drie dagen vraagt de app of het wél gegeven is.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 999px; background: #C9F3EE; color: #0E6F69; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;\">3<\u002Fdiv>\n        <div><div style=\"font-weight: 600; font-size: 14.5px;\">Management en voeding apart<\u002Fdiv><div style=\"font-size: 13.5px; line-height: 1.5; color: rgba(27,42,42,0.6);\">Alles wat niet dagelijks afgevinkt hoeft te worden staat als naslag onder een eigen tab.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 12px; align-items: flex-start;\">\n        <div style=\"width: 26px; height: 26px; border-radius: 999px; background: #C9F3EE; color: #0E6F69; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;\">4<\u002Fdiv>\n        <div><div style=\"font-weight: 600; font-size: 14.5px;\">Bestellijst vooraf<\u002Fdiv><div style=\"font-size: 13.5px; line-height: 1.5; color: rgba(27,42,42,0.6);\">Totaal aantal grammen per product voor het hele protocol, via het lijst-icoon rechtsboven.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border- yMin }} – {{ hayMax }} kg<\u002Fdiv>\n            <div style=\"font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.65);\">per 24 uur<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; line-height: 1.55; color: rgba(255,255,255,0.72); margin-top: 8px;\">2 tot 3 kg ruwvoer per 100 kg gewenst lichaamsgewicht. Bij een streefgewicht van {{ targetWeight }} kg komt dat uit op {{ hayMin }} tot {{ hayMax }} kg per dag. Maximaal 1 uur leegstand, ook 's nachts, liever geen.<\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.14);\">\n            <div style=\"flex: 1; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 10px;\">\n              <div style=\"font-size: 9.5px; color: rgba(255,255,255,0.6); letter-spacing: 0.06em; text-transform: uppercase;\">Suiker<\u002Fdiv>\n              <div style=\"font-weight: 700; font-size: 14px; margin-top: 2px;\">onder 7%<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 1; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 10px;\">\n              <div style=\"font-size: 9.5px; color: rgba(255,255,255,0.6); letter-spacing: 0.06em; text-transform: uppercase;\">Eiwit<\u002Fdiv>\n              <div style=\"font-weight: 700; font-size: 14px; margin-top: 2px;\">6 – 9%<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid rgba(27,42,42,0.1); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px;\">\n          <div style=\"width: 34px; height: 34px; border-radius: 10px; background: #EAFBF9; color: #108A82; display: grid; place-items: center; flex-shrink: 0;\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\" =\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-weight: 700; font-size: 16px;\">Stress &amp; kudde<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n            <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#18BAB0\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 14px; line-height: 1.45;\">Voer in porties gescheiden aanbieden, voernijd met Kenzo<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#18BAB0\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 14px; line-height: 1.45;\">Grote veranderingen zoveel mogelijk vermijden of gefaseerd<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#18BAB0\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px;\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><span style=\"font-size: 14px; line-height: 1.45;\">Bachbloesems: Chicory, Vine, Holly en Walnut, 8 weken<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAnalyse }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #EAFBF9; border-radius: 22px; padding: 20px; margin-bottom: 16px;\">\n          <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #108A82; margin-bottom: 8px;\">Focuspunten vanuit de intake<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.6; color: #1B2A2A;\">Een gevoelige darmgezondheid, overgewicht en een mogelijk verstoorde suikerstofwisseling. Het mestwater, de opgeblazen buik, het vocht in de benen en de jeuk hangen met elkaar samen, het lichaam vangt veranderingen niet meer op.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(27,42,42,0.45); margin-bottom: 10px;\">Waar we aan gaan werken<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;\">\n          <div style=\"background: #FFFFFF; border: 1px solid rgba(27,42,42,0.1); border-radius: 16px; padding: 14px 15px;\">\n            <div style=\"font-weight: 600; font-size: 14.5px;\">Darmflora herstellen<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.5; color: rgba(27,42,42,0.55); margin-top: 2px;\">Jaren voordroog hebben de pH verlaagd. Slijmstoffen en lapacho bouwen het milieu terug op.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid rgba(27,42,42,0.1); border-radius: 16px; padding: 14px 15px;\">\n            <div style=\"font-weight: 600; font-size: 14.5px;\">Stabiele suikerinname<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.5; color: rgba(27,42,42,0.55); margin-top: 2px;\">Suikerarm ruwvoer en rustig afvallen, niet door minder hooi, maar door ander hooi.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; border: 1px solid rgba(27,42,42,0.1); border-radius: 16px; padding: 14px 15px;\">\n            <div style=\"font-weight: 600; font-size: 14.5px;\">Lymfe en belastbaarheid<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.5; color: rgba(27,42,42,0.55); margin-top: 2px;\">Dagelijkse rustige beweging binnen het revalidatieplan van de dierenarts.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: rgba(251,248,243,0.94); backdrop-filter: blur(12px); border-top: 1px solid rgba(27,42,42,0.1); display: flex; align-items: flex-start; padding: 10px 8px 0; z-index: 5;\">\n      <button style=\"flex: 1; background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; padding: 4px 0; color: rgba(27,42,42,0.6);\">\n        <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size: 10px; font-weight: 600;\">Home<\u002Fspan>\n      <\u002Fbutton>\n      <button style=\"flex: 1; background: transparent; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-family: inherit; padding: 4px 0; color: rgba(27,42,42,0.6);\">\n        <svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><path d=\"M3 12h18\"><\u002Fpath><\u002Fsvg>\n        <span style=\"font-size: 10px; font-weight: 600;\">Sc sheetStep }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position: absolute; inset: 0; background: rgba(11,74,73,0.42); z-index: 10; display: flex; align-items: flex-end;\">\n        <div style=\"width: 100%; background: #FBF8F3; border-radius: 28px 28px 0 0; padding: 12px 22px 34px; max-height: 84%; overflow-y: auto;\">\n          <div style=\"width: 40px; height: 4px; border-radius: 999px; background: rgba(27,42,42,0.18); margin: 0 auto 18px;\"><\u002Fdiv>\n          <div style=\"font-family: 'Source Sans 3'; font-weight: 700; font-size: 21px; line-height: 1.15;\">{{ stepTitle }}<\u002Fdiv>\n          <div style=\"font-size: 13px; color: rgba(27,42,42,0.5); margin-top: 4px;\">{{ stepWeeks }}<\u002Fdiv>\n          <div style=\"font-size: 14.5px; line-height: 1.6; color: rgba(27,42,42,0.75); margin-top: 14px;\">{{ stepFocus }}<\u002Fdiv>\n\n          <sc-if value=\"{{ stepHasItems }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(27,42,42,0.45); margin: 20px 0 10px;\">Per kruid<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n              <sc-for list=\"{{ stepItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n                <div style=\"background: #FFFFFF; border: 1px solid rgba(27,42,42,0.1); border-radius: 14px; padding: 12px 14px;\">\n                  <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n                    <span style=\"font-weight: 700; font-size: 14.5px;\">{{ it.name }}<\u002Fspan>\n                    <span style=\"font-family: 'Source Sans 3'; font-weight: 700; font-size: 13.5px; color: #127A79; white-space: nowrap;\">{{ it.dose }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 13px; line-height: 1.5; color: rgba(27,42,42,0.6); margin-top: 4px;\"> n-top: 1px;\">{{ r.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family: 'Source Sans 3'; font-weight: 700; font-size: 15px; color: #127A79; white-space: nowrap; font-variant-numeric: tabular-nums;\">{{ r.total }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background: #EAFBF9; border-radius: 16px; padding: 14px 16px; margin-top: 14px; font-size: 13px; line-height: 1.55; color: #0E6F69;\">Met code <strong>paardentherapeut<\u002Fstrong> krijg je 5% korting boven de € 35 bij D-tails.<\u002Fdiv>\n\n          <button style=\"width: 100%; margin-top: 16px; padding: 14px; border-radius: 999px; border: 0; background: #18BAB0; color: white; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;\" style-hover=\"background: #108A82;\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6\"><\u002Fpath><path d=\"M10 14 21 3\"><\u002Fpath><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"><\u002Fpath><\u002Fsvg>\n            Open de webshop\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"width: 100%; margin-top: 8px; padding: 13px; border-radius: 999px; border: 0; background: transparent; color: rgba(27,42,42,0.55); font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;\">Sluiten<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;horseName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Boaz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;targetWeightKg&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:500,&quot;min&quot;:100,&quot;max&quot;:900,&quot;step&quot;:10,&quot;unit&quot;:&quot;kg&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;showOrderLinks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showMissedPrompt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'vandaag',\n    checked: { psyllium: true, heemst: true, kamille: true },\n    sheet: null,\n    herb: null,\n    selectedDay: 10,\n    missedResolved: false,\n  };\n\n  items() {\n    return [\n      { id: 'psyllium', group: 'feed', name: 'Psylliumzaad', dose: '175 g · 2× daags', why: 'Legt een beschermend laagje in de maag tegen stress en maagzuur.',\n        weeks: 'Week 1 t/m 6', how: 'Mee laten weken met warm (niet kokend) water samen met de balancer. Zorg altijd voor voldoende vers drinkwater.' },\n      { id: 'heemst', group: 'feed', name: 'Heemstwortel', dose: '20 g', why: 'Verzacht en beschermt de maag- en darmslijmvliezen.',\n        weeks: 'Week 1 t/m 6', how: '20 g laten weken in circa 200 ml heet water (60–80 °C), 20 tot 30 minuten, regelmatig doorroeren. Vocht met restant kruid door de bijvoeding.' },\n      { id: 'kamille', group: 'feed', name: 'Kamille', dose: '25 g', why: 'Koelend en ontspannend op het zenuwstelsel, helpt ontkrampen.',\n        weeks: 'Week 1 t/m 6', how: 'Samen met de heemstwortel mee laten weken. Vocht met restant kruiden gebruiken om de bijvoeding aan te maken.' },\n      { id: 'msm', group: 'feed', name: 'MSM (zwavel)', dose: 'Dosering leverancier', why: 'Ondersteunt pezen, banden en bindweefsel, belangrijk met zijn peesgeschiedenis.',\n        weeks: 'Week 2 t/m 9', how: 'Aanbevolen dosering van de leverancier aanhouden voor een paard, door de bijvoeding.' },\n      { id: 'zink', group: 'feed', name: 'Zink', dose: '40 g', why: 'Voor hoeven, huid en immuunsysteem. Denk aan de diepe straalgroeven.',\n        weeks: 'Week 2 t/m 9', how: 'Okapi Zinkchelaat Plus, 1× daags 40 gram door de bijvoeding.' },\n      { id: 'colo', group: 'feed', name: 'Colobalance', dose: '50 g', tag: 'Laatste dag', tagBg: '#FDF4E4', tagColor: '#7A5A16', why: 'Versterkt de darmflora en kalmeert het acute mestwater.',\n        weeks: 'Week 2 t/m 3 · vandaag de laatste', how: '50 gram per dag door de bijvoeding. De natte variant Veendrenk kan ook: 4 eetlepels per dag.' },\n      { id: 'lapacho', group: 'new', name: 'Lapachoschors', dose: '5 gram', previewDose: '20 g / dag', buildLabel: 'dag 1 van 7', order: true,\n        why: 'Herstelt het darmmilieu na jaren van verzuring.',\n        weeks: 'Week 3 t/m 8', how: 'Gemalen, over het voer. De hoeveelheid loopt in zeven dagen op naar de volledige dosering, de app past het elke dag voor je aan.' },\n      { id: 'weegbree', group: 'new', name: 'Smalle weegbree', dose: '6 gram', previewDose: '25 g / dag', buildLabel: 'dag 1 van 7', order: true,\n        why: 'Ontlasting regulerend. Voert overtollig vocht en afvalstoffen af.',\n        weeks: 'Week 3 t/m 8', how: 'Gedroogd door het voer. De hoeveelheid loopt in zeven dagen op naar de volledige dosering, de app past het elke dag voor je aan.' },\n      { id: 'brandnetel', group: 'new', name: 'Brandnetel', dose: '6 gram', previewDose: '25 g / dag', buildLabel: 'dag 1 van 7', order: true,\n        why: 'Rijk aan vitamines en mineralen, werkt vochtafdrijvend bij de dikke benen.',\n        weeks: 'Week 3 t/m 8', how: 'Gedroogd door het voer. De hoeveelheid loopt in zeven dagen op naar de volledige dosering, de app past het elke dag voor je aan.' },\n      { id: 'bach', group: 'loose', name: 'Bachbloesems', dose: '6 druppels · 2 tot 4× daags', why: 'Chicory, Vine, Holly en Walnut, voor voernijd, dominantie en de vele verhuizingen.',\n        weeks: '8 weken', how: 'Nooit het pipet in de mond. Druppel gelijkmatig over drie grasbrokjes, of als allerlaatste over het voer.' },\n      { id: 'bessen', group: 'loose', name: 'Duindoorn, rozenbottel & paardenbloemwortel', dose: '1 tl · handje · handje', why: 'Los uit de hand, naast het protocol. Omega-vetzuren, vitamine C en antioxidanten.',\n        weeks: '4 weken', how: 'Gewoon uit de hand is prima. 1 theelepel duindoornbessen, een klein handje rozenbottels en een handje paardenbloemwortel.' },\n      { id: 'wandeling', group: 'loose', name: 'Snackwandeling', dose: '15 tot 20 minuten stap', why: 'Met vers groen: wilgentakken, kleefkruid, weegbree, paardenbloem, brandnetel.',\n        weeks: 'Dagelijks', how: 'Rustig aan de hand, binnen het revalidatieplan. Beweging is voor hem medicijn nummer 1, voor gewicht, benen, darmen en luchtwegen.' },\n    ];\n  }\n\n  stepMeta() {\n    return {\n      step1: { title: 'Stap 1: maag verzorgen', weeks: 'Week 1 t/m 6',\n        focus: 'We beschermen en verzachten het maag- en darmslijmvlies. De slijmstoffen verminderen irritatie, neutraliseren maagzuur en zorgen dat de bloedsuikerpiek na een maaltijd lager uitvalt.',\n        items: ['psyllium', 'heemst', 'kamille'] },\n      step2: { title: 'Stap 2: darmgezondheid', weeks: 'Week 3 t/m 8 · gestart deze week',\n        focus: 'Na jaren voordroog en wisselend hooi is de darmflora uit balans. Deze stap herstelt het darmmilieu en reguleert het mestwater.',\n        items: ['colo', 'lapacho', 'weegbree', 'brandnetel'] },\n      contact: { title: 'Contactmoment', weeks: 'Week 7',\n        focus: 'Je stuurt in week 7 een update over hoe het gaat: eetlust, mest, gedrag en gewicht. Op basis daarvan bepalen we samen de vervolgstappen.',\n        items: [] },\n    };\n  }\n\n  decorate(it) {\n    const on = !!this.state.checked[it.id];\n    return {\n      ...it,\n      hasTag: !!it.tag,\n      tagBg: it.tagBg || '#EAFBF9',\n      tagColor: it.tagColor || '#0E6F69',\n      showOrder: !!it.order && (this.props.showOrderLinks ?? true),\n      boxBg: on ? '#18BAB0' : 'transparent',\n      boxBorder: on ? '#18BAB0' : 'rgba(27,42,42,0.22)',\n      tickOpacity: on ? 1 : 0,\n      nameColor: on ? 'rgba(27,42,42,0.4)' : '#1B2A2A',\n      nameDeco: on ? 'line-through' : 'none',\n      toggle: () => this.setState((s) => ({ checked: { ...s.checked, [it.id]: !s.checked[it.id] } })),\n      open: () => this.setState({ sheet: 'herb', herb: it }),\n    };\n  }\n\n  dayCells() {\n    const cells = [];\n    for (let i = 0; i < 5; i++) cells.push({ blank: true, key: 'b' + i });\n    for (let d = 1; d <= 31; d++) cells.push({ blank: false, d });\n    return cells.map((c, i) => {\n      if (c.blank) return { key: 'x' + i, label: '', bg: 'transparent', border: 'transparent', color: 'transparent', weight: 400, select: () => {} };\n      const d = c.d;\n      const missed = !this.state.missedResolved && (d === 7 || d === 8 || d === 9);\n      const sel = this.state.selectedDay === d;\n      let bg = '#FFFFFF', color = 'rgba(27,42,42,0.35)', border = 'rgba(27,42,42,0.07)', weight = 500;\n      if (d < 10 && !missed) { bg = '#18BAB0'; color = '#FFFFFF'; border = '#18BAB0'; weight = 600; }\n      if (d === 6) { bg = '#99E8DF'; color = '#0A4F4B'; border = '#99E8DF'; }\n      if (missed) { bg = '#F7E2C4'; color = '#8A6417'; border = '#E8A33C'; weight = 600; }\n      if (d === 10) { bg = '#0B4A49'; color = '#FFFFFF'; border = '#0B4A49'; weight = 700; }\n      if (sel && d !== 10) border = '#0B4A49';\n      return { key: 'd' + d, label: String(d), bg, color, border, weight, select: () => this.setState({ selectedDay: d }) };\n    });\n  }\n\n  renderVals() {\n    const tab = this.state.tab;\n    const all = this.items();\n    const dueToday = all.filter((i) => i.group !== 'new');\n    const total = dueToday.length;\n    const done = dueToday.filter((i) => this.state.checked[i.id]).length;\n    const pct = Math.round((done / total) * 100);\n    const d = this.state.selectedDay;\n    const missedDays = [7, 8, 9];\n    const isMissed = !this.state.missedResolved && missedDays.indexOf(d) !== -1;\n\n    const tabC = (name) => tab === name ? '#108A82' : 'rgba(27,42,42,0.68)';\n    const under = (name) => tab === name ? '#18BAB0' : 'transparent';\n\n    const herb = this.state.herb || {};\n    const step = this.stepMeta()[this.state.stepId] || {};\n    const stepItemsDetailed = (step.items || []).map((id) => all.find((i) => i.id === id)).filter(Boolean).map((i) => ({ name: i.name, dose: i.dose, why: i.why }));\n\n    const targetWeight = this.props.targetWeightKg ?? 500;\n\n    return {\n      horseName: this.props.horseName ?? 'Boaz',\n      targetWeight,\n      hayMin: Math.round(targetWeight * 2 / 100),\n      hayMax: Math.round(targetWeight * 3 / 100),\n      isVandaag: tab === 'vandaag', isKalender: tab === 'kalender', isVoeding: tab === 'voeding',\n      isManagement: tab === 'management', isAnalyse: tab === 'analyse',\n      screenSub: tab === 'vandaag' ? 'Week 3 van 9 · maandag 10 augustus'\n        : tab === 'kalender' ? 'Kalender · augustus 2026'\n        : tab === 'voeding' ? 'Basisvoeding'\n        : tab === 'management' ? 'Managementadvies'\n        : 'Analyse en fases',\n      sVandaag: tabC('vandaag'), sKalender: tabC('kalender'), sVoeding: tabC('voeding'),\n      sManagement: tabC('management'), sAnalyse: tabC('analyse'),\n      uVandaag: under('vandaag'), uKalender: under('kalender'), uVoeding: under('voeding'),\n      uManagement: under('management'), uAnalyse: under('analyse'),\n      goVandaag: () => this.setState({ tab: 'vandaag' }),\n      goKalender: () => this.setState({ tab: 'kalender' }),\n      goVoeding: () => this.setState({ tab: 'voeding' }),\n      goManagement: () => this.setState({ tab: 'management' }),\n      goAnalyse: () => this.setState({ tab: 'analyse' }),\n\n      feedItems: all.filter((i) => i.group === 'feed').map((i) => this.decorate(i)),\n      upcomingItems: all.filter((i) => i.group === 'new').map((i) => ({ name: i.name, dose: i.previewDose })),\n      looseItems: all.filter((i) => i.group === 'loose').map((i) => this.decorate(i)),\n      doneCount: done, totalCount: total, donePct: pct, doneWidth: pct + '%',\n\n      days: this.dayCells(),\n      showMissed: (this.props.showMissedPrompt ?? true) && !this.state.missedResolved,\n      resolveMissedYes: () => this.setState({ missedResolved: true }),\n      resolveMissedNo: () => this.setState({ missedResolved: true }),\n\n      sheetHerb: this.state.sheet === 'herb',\n      sheetOrders: this.state.sheet === 'orders',\n      sheetStep: this.state.sheet === 'step',\n      openOrders: () => this.setState({ sheet: 'orders' }),\n      openStep1: () => this.setState({ sheet: 'step', stepId: 'step1' }),\n      openStep2: () => this.setState({ sheet: 'step', stepId: 'step2' }),\n      openStepContact: () => this.setState({ sheet: 'step', stepId: 'contact' }),\n      closeSheet: () => this.setState({ sheet: null }),\n      herbName: herb.name || '', herbDose: herb.dose || '', herbWhy: herb.why || '',\n      herbHow: herb.how || '', herbWeeks: herb.weeks || '',\n      stepTitle: step.title || '', stepWeeks: step.weeks || '', stepFocus: step.focus || '',\n      stepHasItems: stepItemsDetailed.length > 0, stepItems: stepItemsDetailed,\n\n      orderRows: [\n        { name: 'Psylliumzaad', detail: '175 g per dag · 6 weken', total: '7,4 kg' },\n        { name: 'Heemstwortel', detail: '20 g per dag · 6 weken', total: '850 g' },\n        { name: 'Kamille', detail: '25 g per dag · 6 weken', total: '1,1 kg' },\n        { name: 'Aardpeerpellets', detail: '50 g per dag · 14 dagen', total: '700 g' },\n        { name: 'MSM (zwavel)', detail: 'dosering leverancier · 8 weken', total: '8 wk' },\n        { name: 'Zink', detail: '40 g per dag · 8 weken', total: '2,3 kg' },\n        { name: 'Colobalance', detail: '50 g per dag · 14 dagen', total: '700 g' },\n        { name: 'Lapachoschors', detail: '20 g per dag · 6 weken', total: '850 g' },\n        { name: 'Smalle weegbree', detail: '25 g per dag · 6 weken', total: '1,1 kg' },\n        { name: 'Brandnetel', detail: '25 g per dag · 6 weken', total: '1,1 kg' },\n        { name: 'Bachbloesem-mengsel', detail: 'receptuurflesje · 8 weken', total: '1 flesje' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
