document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

k, never #000 */\n  --ink-70:    rgba(27, 42, 42, 0.7);\n  --ink-50:    rgba(27, 42, 42, 0.5);\n  --ink-30:    rgba(27, 42, 42, 0.3);\n  --ink-15:    rgba(27, 42, 42, 0.15);\n  --ink-08:    rgba(27, 42, 42, 0.08);\n  --white:     #FFFFFF;\n\n  /* ---- Semantic surfaces ---- */\n  --fg-1:        var(--ink);\n  --fg-2:        var(--ink-70);\n  --fg-muted:    var(--ink-50);\n  --fg-on-mint:  var(--white);\n  --fg-on-deep:  var(--canvas);\n\n  --bg-1:        var(--canvas);\n  --bg-2:        var(--canvas-2);\n  --bg-deep:     var(--bg-green-900);\n  --bg-mint:     var(--mint);\n  --bg-mint-soft:var(--mint-50);\n\n  --border-1:    var(--ink-15);\n  --border-active: var(--mint-500);\n\n  /* ---- Status (functional, brand-tinted) ---- */\n  --success: #2EA875;\n  --warning: #D9A441;\n  --danger:  #C2543E;\n\n  /* ---- Type ---- */\n  --font-sans: 'Source Sans 3', 'Myriad Pro', 'Helvetica Neue', system-ui, sans-serif;\n  --font-display: 'Source Sans 3', 'Myriad Pro', 'Helvetica Neue', system-ui, sans-serif;\n\n  --fs-12: 12px;\n  --fs-14: 14px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-24: 24px;\n  --fs-28: 28px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-48: 48px;\n  --fs-64: 64px;\n  --fs-80: 80px;\n\n  --fw-regular:  400;\n  --fw-medium:   500;\n  --fw-semibold: 600;\n  --fw-bold:     700;\n\n  --lh-tight:  1.1;\n  --lh-snug:   1.25;\n  --lh-base:   1.55;\n  --lh-loose:  1.75;\n\n  --tracking-display: 0.04em;     /* uppercase headlines */\n  --tracking-eyebrow: 0.14em;     /* small uppercase eyebrow labels */\n  --tracking-base:    0;\n\n  /* ---- Spacing (4-px base) ---- */\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* ---- Radii ---- */\n  --radius-xs:  4px;\n  --radius-sm:  8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-2xl: 32px;\n  --radius-pill: 9999px;\n\n  /* ---- Shadows (tinted with --blue-green, not neutral grey) ---- */\n  --shadow-xs: 0 1px 2px rgba(18, 122, 121, 0.06);\n  --shadow-sm: 0 4px 12px rgba(18, 122, 121, 0.08);\n  --shadow-md: 0 12px 32px rgba(18, 122, 121, 0.10);\n  --shadow-lg: 0 24px 60px rgba(18, 122, 121, 0.16);\n  --shadow-focus: 0 0 0 2px var(--canvas), 0 0 0 4px var(--mint-300);\n\n  /* ---- Motion ---- */\n  --ease-base: cubic-bezier(0.22, 0.61, 0.36, 1);\n  --dur-fast: 120ms;\n  --dur-base: 240ms;\n  --dur-slow: 320ms;\n\n  /* ---- Layout ---- */\n  --content-max: 1280px;\n  --gutter: 24px;\n  --header-h: 72px;\n}\n\n/* ============================================================\n   Semantic typography\n   ============================================================ */\n\nhtml, body {\n  background: var(--bg-1);\n  color: var(--fg-1);\n  font-family: var(--font-sans);\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size: clamp(40px, 5vw, 64px);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--blue-green);\n  margin: 0;\n}\n\nh2, .h2 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size: clamp(28px, 3.4vw, 40px);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--blue-green);\n  margin: 0;\n}\n\nh3, .h3 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-24);\n  line-height: var(--lh-snug);\n  color: var(--ink);\n  margin: 0;\n}\n\nh4, .h4 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-18);\n  line-height: var(--lh-snug);\n  color: var(--ink);\n  margin: 0;\n}\n\n.subtitle {\n  font-family: var(--font-display);\n  font-weight: var(--fw-semibold);\n  font-style: italic;\n  font-size: var(--fs-20);\n  color: var(--mint-700);\n}\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-12);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n  color: var(--mint-700);\n}\n\np, .p {\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  color: var(--fg-1);\n  max-width: 64ch;\n  text-wrap: pretty;\n}\n\n.lead {\n  font-size: var(--fs-20);\n  line-height: var(--lh-base);\n  color: var(--fg-2);\n  max-width: 60ch;\n}\n\n.small {\n  font-size: var(--fs-14);\n  color: var(--fg-2);\n}\n\nem, i, .italic {\n  font-style: italic;\n  /* The brand verbal tic: _écht_. Use sparingly. */\n}\n\na {\n  color: var(--blue-green);\n  text-decoration: none;\n  border-bottom: 1px solid transparent;\n  transition: color var(--dur-fast) var(--ease-base),\n              border-color var(--dur-fast) var(--ease-base);\n}\na:hover {\n  color: var(--mint-700);\n  border-bottom-color: currentColor;\n}\n\ncode, .mono {\n  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  font-size: 0.9em;\n  background: var(--ink-08);\n  padding: 2px 6px;\n  border-radius: var(--radius-xs);\n}\n\n/* ============================================================\n   Utility primitives — buttons, cards, pills\n   (intentionally small; full UI kit lives in /ui_kits)\n   ============================================================ */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  padding: 14px 28px;\n  border-radius: var(--radius-pill);\n  font-family: var(--font-sans);\n  font-weight: var(--fw-semibold);\n  font-size: var(--fs-16);\n  letter-spacing: 0.02em;\n  border: 0;\n  cursor: pointer;\n  transition: background var(--dur-fast) var(--ease-base),\n              color var(--dur-fast) var(--ease-base),\n              transform var(--dur-fast) var(--ease-base),\n              box-shadow var(--dur-fast) var(--ease-base);\n}\n.btn:active { transform: scale(0.98); }\n.btn:focus-visible { outline: none; box-shadow: var(--shadow-focus); }\n\n.btn--primary {\n  background: var(--mint-500);\n  color: var(--white);\n  box-shadow: var(--shadow-sm);\n}\n.btn--primary:hover { background: var(--mint-700); }\n\n.btn--deep {\n  background: var(--bg-green-700);\n  color: var(--canvas);\n}\n.btn--deep:hover { background: var(--bg-green-800); }\n\n.btn--ghost {\n  background: transparent;\n  color: var(--blue-green);\n  border: 1px solid var(--ink-15);\n}\n.btn--ghost:hover {\n  border-color: var(--mint-500);\n  color: var(--mint-700);\n}\n\n.card {\n  background: var(--white);\n  border: 1px solid var(--border-1);\n  border-radius: var(--radius-xl);\n  padding: var(--space-6);\n  box-shadow: var(--shadow-sm);\n}\n\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 6px 12px;\n  border-radius: var(--radius-pill);\n  background: var(--mint-50);\n  color: var(--mint-800);\n  font-size: var(--fs-12);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-eyebrow);\n  text-transform: uppercase;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#FBF8F3;-webkit-font-smoothing:antialiased}\na{color:#127A79}a:hover{color:#0D5C5B}\ninput::placeholder{color:rgba(27,42,42,.55)}\n@keyframes dcspin{to{transform:rotate(360deg)}}\n@keyframes dcbreath{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:1}}\n@keyframes dcdrop{0%{transform:translateY(-6px) rotate(0deg);opacity:0}15%{opacity:1}82%{opacity:1}100%{transform:translateY(66px) rotate(220deg);opacity:0}}\n@keyframes dcpile{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}\n@keyframes dcscoop{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-26deg)}}\n@keyframes dcfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--canvas);disp uiker- en zetmeelgehalte niet exact bekend.<\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--ink-70);margin-top:8px\">Suiker {{ res.su }} · zetmeel niet vermeld<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ res.szUnread }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:19px;font-weight:700;margin-top:4px\">Nog niet bekend<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;color:var(--ink-70);margin-top:2px\">Het zetmeelgehalte is mogelijk niet herkend op je foto.<\u002Fdiv>\n        <div style=\"font-size:14px;color:var(--ink-70);margin-top:8px\">Suiker {{ res.su }} · zetmeel niet herkend<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addMissingPhoto }}\" style=\"appearance:none;border:0;background:transparent;padding:8px 0 0;min-height:40px;color:var(--blue-green);font-family:var(--font-sans);font-weight:700;font-size:15px;cursor:pointer\">Nieuwe foto uploaden »<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid var(--ink-08);border-radius:20px;padding:16px 18px\">\n      <div style=\"font-size:17px;font-weight:700;margin-bottom:4px\">Positief<\u002Fdiv>\n      <sc-for list=\"{{ res.plus }}\" as=\"x\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;gap:10px;padding:6px 0;font-size:15px;line-height:1.45\"><span style=\"color:#1A6B49;font-weight:700;flex-shrink:0\">✔<\u002Fspan><span>{{ x }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ res.hasMinus }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#fff;border:1px solid var(--ink-08);border-radius:20px;padding:16px 18px\">\n      <div style=\"font-size:17px;font-weight:700;margin-bottom:4px\">Verdient aandacht<\u002Fdiv>\n      <sc-for list=\"{{ res.minus }}\" as=\"x\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;gap:10px;padding:6px 0;font-size:15px;line-height:1.45\"><span style=\"width:18px;height:18px 800)\">▶<\u002Fspan><span>{{ n }}<\u002Fspan><\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-if value=\"{{ hasApi }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:13px;font-weight:700;margin:12px 0 6px\">Backendkoppeling (placeholder)<\u002Fdiv>\n      <sc-for list=\"{{ api }}\" as=\"n\" hint-placeholder-count=\"1\">\n        <div style=\"font-size:12px;line-height:1.5;color:var(--ink);padding:5px 8px;background:#fff;border-radius:8px;margin-bottom:4px;font-family:ui-monospace,Menlo,monospace\">{{ n }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPanel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nconst DB = [\n  { id: 'grasbrok', brand: 'Hooiland', name: 'Grasbrok Basis', cat: 'Compleet paardenvoer', checked: true, score: 8,\n    concl: 'Vezelrijke brok op basis van gras en luzerne, met weinig suiker en zetmeel en goed opneembare mineralen.',\n    an: ['10,5', '5,0', '24,0', '9,0', '3,9', '4,1'],\n    plus: ['Weinig suiker en zetmeel', 'Gras en luzerne als hoofdbestanddelen', 'Magnesium als citraat, selenium organisch gebonden'],\n    minus: ['Bierbostel: herkomst niet vermeld'], art: ['suiker', 'mineralen'] },\n  { id: 'puregras', brand: 'Hooiland', name: 'Pure Grasbrok', cat: 'Aanvullend voer', pure: true, checked: true, score: 8,\n    concl: 'Een enkelvoudig grasproduct zonder toevoegingen, rijk aan vezels.',\n    an: ['9,0', '3,0', '26,0', '8,0', '6,5', 'nv'],\n    plus: ['Eén ingrediënt: gedroogd gras', 'Rijk aan vezels', 'Geen melasse of granen'],\n    minus: [], art: ['vezels', 'suiker'] },\n  { id: 'luzerne', brand: 'Weidegoed', name: 'Luzernemix Compleet', cat: 'Compleet paardenvoer', checked: true, score: null,\n    concl: '',\n    an: ['14,0', '4,5', '22,0', '10,0', '7,5', 'nv'],\n    plus: ['Luzerne als hoofdbestanddeel', 'Lijnzaad als vetbron'],\n    minus: ['Bevat haverdoppen en tarwegries'],\n    missing: [{ t: 'Zetmeel niet vermeld', d: 'De fabrikant vermeldt geen zetmeelgehalte. Daardoor kunnen we het totale suiker- en zetmeelgehalte niet exact berekenen.', neutral: true }],\n    art: ['suiker', 'vezels'] },\n  { id: 'senior', brand: 'Hooiland', name: 'Grasbrok Senior', cat: 'Compleet paardenvoer', checked: true, score: 7,\n    concl: 'Zachte, vezelrijke brok. Iets meer zetmeel door toegevoegde gepofte mais.',\n    an: ['11,0', '6,0', '20,0', '8,5', '4,5', '7,5'],\n    plus: ['Vezelrijke basis', 'Lijnzaad als vetbron'], minus: ['Gepofte mais verhoogt het zetmeelgehalte'], art: ['suiker', 'vezels'] },\n  { id: 'muesli', brand: 'Weidegoed', name: 'Kruidenmuesli Sensitive', cat: 'Aanvullend voer', checked: false, score: 6,\n    concl: 'Vezelrijke basis met weinig suiker en zetmeel. Er gaan punten af voor de vetbron en de vorm van magnesium.',\n    an: ['11,5', '7,0', '21,0', '8,5', '4,8', '6,2'],\n    plus: ['Weinig suiker en zetmeel', 'Luzerne en grasvlokken als hoofdbestanddelen', 'Geen melasse of granen'],\n    minus: ['Sojaolie als vetbron', 'Magnesiumoxide: minder goed opneembaar', 'Toevoegingen maar deels vermeld'], art: ['suiker', 'mineralen'] },\n  { id: 'slobber', brand: 'Weidegoed', name: 'Bietenpulp Slobber', cat: 'Slobber', checked: true, score: 7,\n    concl: 'Melasse-arme bietenpulp met een korte, herkenbare ingrediëntenlijst.',\n    an: ['10,0', '4,0', '17,5', '7,0', '6,5', '1,5'],\n    plus: ['Weinig suiker en zetmeel', 'Melasse-arme bietenpulp als basis', 'Korte ingrediëntenlijst'],\n    minus: ['Tarwezemelen: ongunstige calcium-fosforverhouding'], art: ['vezels', 'slobber'] },\n  { id: 'balancer', brand: 'Hoeve Voeders', name: 'Balancer Mineraal Plus', cat: 'Balancer', checked: true, score: 5,\n    concl: 'Ruim aanbod van vitaminen en mineralen, maar op een basis van tarwegries en melasse.',\n    an: ['14,0', '3,5', '9,0', '18,0', '6,0', '12,0'],\n    plus: ['Vitaminen en sporenelementen per kg vermeld', 'Calcium en fosfor in goede verhouding'],\n    minus: ['Tarwegries als hoofdbestanddeel', 'Melasse op de tweede plaats'], art: ['mineralen', 'suiker'] },\n  { id: 'sport', brand: 'Hoeve Voeders', name: 'Sportmix Energie', cat: 'Aanvullend voer', checked: true, score: 3,\n    concl: 'Veel granen en melasse. Het suiker- en zetmeelgehalte is hoog.',\n    an: ['12,0', '5,5', '8,0', '7,0', '9,5', '28,0'],\n    plus: ['Toevoegingen per kg vermeld'],\n    minus: ['Geplette gerst en mais als hoofdbestanddelen', 'Melasse op de derde plaats', 'Hoog suiker- en zetmeelgehalte'], art: ['granen', 'suiker'] },\n];\nconst NEW_OK = { id: 'new', brand: 'Stalmeester', name: 'Krachtvoer Sport', cat: 'Aanvullend voer', checked: false, score: 4,\n  concl: 'Een graanrijke basis met toegevoegde suikers. De vezelbronnen staan laag in de ingrediëntenlijst.',\n  an: ['13,0', '6,0', '10,0', '8,0', '7,5', '24,0'],\n  plus: ['Lijnzaad als vetbron', 'Vitamine E per kg vermeld'],\n  minus: ['Haver en mais als hoofdbestanddelen', 'Dextrose toegevoegd', 'Hoog suiker- en zetmeelgehalte'], art: ['granen', 'suiker'] };\nconst NEW_MISS = Object.assign({}, NEW_OK, { score: null, an: ['13,0', '6,0', '10,0', '8,0', '7,5', 'unread'],\n  plus: ['Lijnzaad als vetbron'], minus: ['Haver en mais als hoofdbestanddelen', 'Dextrose toegevoegd'],\n  missing: [\n    { t: 'Zetmeel niet herkend', d: 'Mogelijk niet goed leesbaar op je foto. Nodig voor het totale suiker- en zetmeelgehalte.' },\n    { t: 'Vitaminen en mineralen', d: 'Staan waarschijnlijk op een ander deel van de verpakking.' },\n  ] });\nconst AN_KEYS = ['Ruw eiwit', 'Ruw vet', 'Ruwe celstof', 'Ruwe as', 'Suiker', 'Zetmeel'];\nconst ART = {\n  suiker: { t: 'Suiker en zetmeel: waarom je ze samen bekijkt', m: 'Artikel · 4 min' },\n  mineralen: { t: 'Welke vorm van magnesium neemt je paard op?', m: 'Artikel · 6 min' },\n  vezels: { t: 'Ruwvoer en vezels als basis van elk rantsoen', m: 'Video · 9 min' },\n  granen: { t: 'Granen in paardenvoer: wat doet zetmeel in de darm?', m: 'Artikel · 5 min' },\n  slobber: { t: 'Slobber goed laten weken', m: 'Artikel · 3 min' },\n};\nconst LABEL = { 1: 'Zeer slecht', 2: 'Slecht', 3: 'Zeer onvoldoende', 4: 'Onvoldoende', 5: 'Matig', 6: 'Voldoende', 7: 'Ruim voldoende', 8: 'Goed', 9: 'Zeer goed', 10: 'Uitstekend' };\nconst pct = (s) => s + '%';\nconst num = (s) => parseFloat(String(s).replace(',', '.'));\nconst color = (sc) => ({ green: sc != null && sc >= 7, orange: sc != null && sc >= 5 && sc < 7, red: sc != null && sc < 5, none: sc == null });\nconst HIST = [['grasbrok', 'Vandaag'], ['new-miss', 'Gisteren'], ['puregras', '23 okt'], ['muesli', '21 okt'], ['sport', '18 okt'], ['slobber', '12 okt']];\nconst JUMPS = [\n  ['start', 'Leeg / start'], ['search', 'Zoeken'], ['camera', 'Camera'], ['lookup', 'Opzoeken'], ['found', 'Product gevonden'],\n  ['unknown', 'Product onbekend'], ['uploading', 'Uploaden bezig'], ['blurry', 'Onscherpe foto'], ['uploadError', 'Uploadfout'],\n  ['analysing', 'Analyse bezig'], ['provisional', 'Voorlopige analyse'], ['final', 'Definitieve analyse'], ['missing', 'Waarde niet herkend'], ['puregras', 'Pure grasbrok · zetmeel niet vermeld'], ['nvmix', 'Samengesteld · zetmeel niet vermeld'], ['history', 'Scanhistorie'],\n];\nconst NOTES = {\n  start: ['Eén vraag, twee routes: foto van de voorkant (hoofdroute) of zoeken.', 'De camera vraagt eerst alleen de voorkant. Etiketfoto’s zijn pas nodig als het voer onbekend is.', 'Recente scans voor snel terugvinden.'],\n  search: ['Suggesties verschijnen tijdens het typen.', 'Onderaan altijd een uitweg: het getypte voer toevoegen. De naam gaat mee naar het volgende scherm.'],\n  camera: ['Eén foto per keer, daarna terug naar waar je was.', 'Album-knop voor een bestaande afbeelding.'],\n  lookup: ['Rustige wachttoestand, zonder technische termen.'],\n  found: ['Productkaart met foto, categorie en status. Eén hoofdactie: Bekijk voeranalyse.', '“Dit is niet mijn voer” leidt terug naar zoeken.'],\n  upload: ['Melding en uploadvelden staan op één scherm: een stap minder.', 'Twee verplichte velden, elk met Camera of Uploaden, preview en Vervangen.', 'De knop onderaan zegt hoeveel foto’s nog nodig zijn.', 'Voorkant wordt alleen gevraagd als de getypte naam te weinig zegt (één woord).', 'Terug en weer heen: naam en foto’s blijven bewaard.'],\n  analysing: ['Drie wisselende teksten, daarna vanzelf het resultaat.'],\n  result: ['Suiker + zetmeel alleen gezamenlijk; de grenswaarde staat er alleen bij als het totaal bekend is.', 'Pure gras- of hooibrok zonder zetmeelvermelding: neutraal “Niet vermeld” met korte toelichting, geen waarschuwing.', 'Rapportcijfer in een groene (7+), oranje (5–6) of rode (≤4) cirkel, altijd met tekstlabel.', 'Alleen bij een nog niet gecontroleerd product staat het subtiele label Voorlopige beoordeling.', 'Analytische bestanddelen uitklapbaar om de pagina rustig te houden.', 'Bij bekende producten een subtiele link voor een andere samenstelling.'],\n  missing: ['Onbekende waarden worden nooit als 0% getoond.', 'Niet vermeld (grijs, neutraal) is iets anders dan niet herkend (oranje, met fotoknop).', 'Geen cijfer: een lege cirkel met vraagteken, nooit 0/10.', 'Concreet wat ontbreekt en één vervolgactie. Eerdere foto’s blijven bewaard.'],\n  history: ['Zonder rapportcijfer toont de lijst een vraagteken, nooit een 0.'],\n};\nconst API = {\n  search: ['GET /products?q={tekst} · typeahead'],\n  lookup: ['POST /products/identify · foto voorkant → product of onbekend'],\n  found: ['GET /products/{id}'],\n  upload: ['POST /uploads · per foto, met voortgang', 'POST /submissions · naam + foto’s → reviewwerkvoorraad'],\n  analysing: ['GET /submissions/{id}/analysis · status ophalen'],\n  result: ['GET /products/{id}/analysis', 'GET /library?tags=… · gerelateerde artikelen'],\n  history: ['GET /me/scans'],\n};\n\nclass Component extends DCLogic {\n  state = { screen: 'start', q: '', pid: 'grasbrok', from: 'start', mode: 'unknown', origin: 'search', name: '', fields: {}, extras: [], camMode: 'front', camKey: null, blurShown: false, step: 0, frontOk: true, outcome: 'ok', open: {}, variantSent: false, sheet: null, replaceKey: null };\n\n  componentWillUnmount() { clearInterval(this.t); clearInterval(this.u); }\n  componentDidUpdate() {\n    if (this._last !== this.state.screen) { this._last = this.state.screen; document.querySelectorAll('[data-scroll]').forEach((x) => { x.scrollTop = 0; }); }\n  }\n  go(screen, extra) {\n    clearInterval(this.t);\n    this.setState(Object.assign({ screen, sheet: null }, extra || {}));\n    if (screen === 'lookup') {\n      this.t = setTimeout(() => {\n        if (this.state.frontOk) this.go('found', { pid: 'grasbrok', from: 'start' });\n        else this.openUpload('unknown', 'photo', '');\n      }, 1600);\n    }\n    if (screen === 'analysing') {\n      this.setState({ step: 0 });\n      this.t = setInterval(() => {\n        const n = this.state.step + 1;\n        if (n >= 3) { clearInterval(this.t); this.finishAnalysis(); } else this.setState({ step: n });\n      }, 1100);\n    }\n  }\n  openUpload(mode, origin, name, fields) {\n    const f = fields || {};\n    if (origin === 'photo' && !f.voor) f.voor = { st: 'done', src: 'camera' };\n    this.go('upload', { mode, origin, name: name == null ? this.state.name : name, fields: f, extras: [], blurShown: false });\n  }\n  finishAnalysis() {\n    if (this.state.mode === 'variant') this.go('result', { variantSent: true, from: 'flow' });\n    else this.go('result', { pid: this.state.outcome === 'ok' ? 'new' : 'new-miss', from: 'flow', variantSent: false });\n  }\n  setField(k, v) { this.setState((s) => ({ fields: Object.assign({}, s.fields, { [k]: v }) })); }\n  startUpload(k, src) {\n    this.setField(k, { st: 'uploading', p: 0, src });\n    clearInterval(this.u);\n    this.u = setInterval(() => {\n      const fs = Object.assign({}, this.state.fields); let busy = false;\n
