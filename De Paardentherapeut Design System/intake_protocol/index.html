<style>
/* Brief card (the "read me first" artboard in the canvas) */
.brief-card {
  width: 680px;
  background: linear-gradient(160deg, var(--canvas) 0%, var(--mint-50) 100%);
  border-radius: 18px;
  padding: 32px 36px;
  font-family: var(--font-sans);
  color: var(--app-ink);
  border: 1px solid var(--app-border);
  box-shadow: 0 12px 28px rgba(18, 122, 121, 0.10);
  position: relative;
  overflow: hidden;
}
.brief-card::after {
  content: ''; position: absolute; right: -60px; bottom: -80px;
  width: 240px; height: 240px;
  background: radial-gradient(circle, var(--mint-300) 0%, transparent 65%);
  opacity: 0.18; pointer-events: none;
}
.brief-tag {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 700; color: var(--app-accent-strong); margin-bottom: 10px;
}
.brief-card h1 {
  font-family: var(--font-display); font-weight: 700;
  font-size: 30px; line-height: 1.1; letter-spacing: -0.01em;
  color: var(--app-deep-strong); text-transform: none;
  margin: 0 0 14px;
}
.brief-card .lede {
  font-size: 14.5px; line-height: 1.6;
  color: var(--app-ink-2); margin: 0 0 22px;
  max-width: 60ch;
}
.brief-card .lede em {
  color: var(--app-deep-strong); font-weight: 600; font-style: normal;
  background: var(--app-accent-soft); padding: 0 5px; border-radius: 3px;
}
.brief-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 22px 32px;
  margin-bottom: 22px;
  position: relative; z-index: 1;
}
.brief-grid h3 {
  font-family: var(--font-display); font-weight: 700;
  font-size: 13.5px; color: var(--app-deep-strong);
  text-transform: none; letter-spacing: 0;
  margin: 0 0 8px;
}
.brief-grid ol {
  margin: 0; padding-left: 22px;
  font-size: 12.5px; line-height: 1.65; color: var(--app-ink-2);
}
.brief-grid ol li::marker {
  color: var(--app-accent-strong); font-weight: 700;
}
.brief-foot {
  font-size: 11.5px; line-height: 1.55; color: var(--app-ink-3);
  border-top: 1px dashed var(--app-border);
  padding-top: 12px;
  position: relative; z-index: 1;
}
</style>
</head>
<body>
<div id="app"></div>
