<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Wordmark lockup</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--canvas); }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .lockup img { height: 78px; width: auto; }
  .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 34px;
    line-height: 1;
    color: var(--blue-green);
    letter-spacing: 0.02em;
  }
  .name .de { color: var(--mint-600); display: block; font-size: 14px; font-style: italic; letter-spacing: 0.04em; margin-bottom: 4px; font-weight: 600; }
  .tag {
    margin-top: 24px;
    font-family: var(--font-display);
    font-style: italic;
    color: var(--mint-700);
    font-size: 18px;
    font-weight: 600;
  }
  .meta { margin-top: 6px; font-size: 12px; color: var(--ink-50); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/logo-horse-mark.png" alt="Logo" />
    <div class="name"><span class="de">de</span>Paardentherapeut</div>
  </div>
  <div class="tag">Paardengezondheid van de toekomst.</div>
  <div class="meta">Primary lockup · Rotterdam · est. 2016</div>
</body>
</html>
