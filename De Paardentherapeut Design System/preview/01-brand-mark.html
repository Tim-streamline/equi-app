<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Brand mark</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: stretch; }
  .tile {
    border-radius: 16px;
    min-height: 120px;
    padding: 18px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    position: relative;
  }
  .tile--canvas { background: var(--canvas); border: 1px solid var(--border-1); }
  .tile--mint   { background: var(--mint); }
  .tile--deep   { background: var(--blue-green); }

  .word {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
  }
  .sub {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    opacity: 0.85;
  }
  .tile--canvas .word { color: var(--blue-green); }
  .tile--canvas .sub  { color: var(--mint-700); }
  .tile--mint .word, .tile--mint .sub,
  .tile--deep .word, .tile--deep .sub { color: var(--canvas); }

  .label {
    position: absolute; bottom: 6px; left: 10px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
  }
  .tile--canvas .label { color: var(--ink-50); }
  .tile--mint .label, .tile--deep .label { color: rgba(255,255,255,0.7); }

  .placeholder-note {
    grid-column: 1 / -1;
    font-family: var(--font-display);
    font-style: italic; font-weight: 600;
    font-size: 12px;
    color: var(--ink-50);
    text-align: center;
    margin-top: -4px;
  }
</style>
</head>
<body>
  <div class="tile tile--canvas">
    <div class="word">EQUINOVA</div>
    <div class="sub">— logo placeholder —</div>
    <span class="label">on canvas</span>
  </div>
  <div class="tile tile--mint">
    <div class="word">EQUINOVA</div>
    <div class="sub">— logo placeholder —</div>
    <span class="label">on mint</span>
  </div>
  <div class="tile tile--deep">
    <div class="word">EQUINOVA</div>
    <div class="sub">— logo placeholder —</div>
    <span class="label">on blue-green</span>
  </div>
  <div class="placeholder-note">New logo in progress · brand-kit colours &amp; type only</div>
</body>
</html>
