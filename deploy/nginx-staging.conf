# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/equi-app.staging.optimize-it.nl/before/*;

server {
    #listen 80;
    #listen [::]:80;

    root /home/ploi/equi-app.staging.optimize-it.nl/current/public;
    server_name equi-app.staging.optimize-it.nl;

    include /etc/nginx/ssl/equi-app.staging.optimize-it.nl;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 100m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/equi-app.staging.optimize-it.nl/server/*;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    access_log off;
    error_log  /var/log/nginx/equi-app.staging.optimize-it.nl-error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_buffers 32 32k;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M\npost_max_size=100M\nmemory_limit=512M\nmax_execution_time=300";
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/equi-app.staging.optimize-it.nl/after/*;
