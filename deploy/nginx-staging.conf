# Ploi owns TLS certificates. This file owns redirects: do not include its
# before/ssl-redirect.conf as that creates a duplicate HTTP virtual host.

map $http_upgrade $equi_connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve request paths and methods when moving HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name equi-app.staging.optimize-it.nl www.equi-app.staging.optimize-it.nl;
    location / { return 308 https://equi-app.staging.optimize-it.nl$request_uri; }
    # Certificate renewal must remain reachable without an existing valid certificate.
    location ^~ /.well-known/acme-challenge/ {
        root /home/ploi/equi-app.staging.optimize-it.nl/current/public;
        default_type text/plain;
        try_files $uri =404;
    }
}

server {
    include /etc/nginx/ssl/equi-app.staging.optimize-it.nl;
    server_name www.equi-app.staging.optimize-it.nl;
    return 308 https://equi-app.staging.optimize-it.nl$request_uri;
}

server {
    # The managed TLS include contains both listen 443 ssl directives and the certificate paths.
    include /etc/nginx/ssl/equi-app.staging.optimize-it.nl;
    server_name equi-app.staging.optimize-it.nl;
    root /home/ploi/equi-app.staging.optimize-it.nl/current/public;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;
    add_header X-Equi-Nginx-Revision "__EQUI_NGINX_REVISION__" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log off;
    error_log /var/log/nginx/equi-app.staging.optimize-it.nl-error.log error;

    include /etc/nginx/ploi/equi-app.staging.optimize-it.nl/server/*;

    # Only Laravel's front controller may execute; never serve PHP or private files as assets.
    location = /index.php {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_buffers 32 32k;
        fastcgi_read_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M\npost_max_size=100M\nmemory_limit=512M\nmax_execution_time=300";
    }
    location ~* \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { deny all; }
    location = /.well-known/jwks.json { rewrite ^ /index.php last; }
    location = /up { rewrite ^ /index.php last; }
    location = /robots.txt { try_files $uri =404; }

    # Admin pages, browser sessions and API requests share the same HTTPS origin.
    location ~ ^/(admin|api|web-session)(/|$) { rewrite ^ /index.php last; }
    location ~ ^/(build|storage)(/|$) { try_files $uri =404; }

    # PowerSync's workers and SQLite WASM are static files; streaming endpoints are proxied.
    location ~ ^/powersync/(worker/|[^/]+\.wasm$) {
        root /home/ploi/equi-app.staging.optimize-it.nl/current/web-dist;
        types { application/wasm wasm; application/javascript js; }
        try_files $uri =404;
    }
    location = /powersync { return 308 /powersync/; }
    location /powersync/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $equi_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Missing assets must be 404, not the SPA HTML. Deep links fall back to the SPA.
    location ~ \.[^/]+$ {
        root /home/ploi/equi-app.staging.optimize-it.nl/current/web-dist;
        try_files $uri =404;
    }
    location = /index.html {
        root /home/ploi/equi-app.staging.optimize-it.nl/current/web-dist;
        expires -1;
        try_files $uri =404;
    }
    location / {
        root /home/ploi/equi-app.staging.optimize-it.nl/current/web-dist;
        try_files $uri /index.html;
    }
}

include /etc/nginx/ploi/equi-app.staging.optimize-it.nl/after/*;
