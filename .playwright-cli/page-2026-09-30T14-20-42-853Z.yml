                    - generic [ref=f2e762]: Kan je paard onvoldoende hooi eten of valt het af, dan kan geweekte, vezelrijke bijvoeding in een grotere hoeveelheid nodig zijn als aanvulling op of vervanging van ruwvoer. Bekijk hiervoor de video "Wat voer je bij gewichtsverlies of gebitsproblemen?"
                - generic [ref=f2e765] [cursor=pointer]:
                  - checkbox "Geef enkel zuivere bijvoeding selecteren" [ref=f2e766]
                  - generic [ref=f2e767]:
                    - generic [ref=f2e768]: Geef enkel zuivere bijvoeding
                    - generic [ref=f2e770]: Gebruik alleen zoveel als nodig is om het protocol te laten eten, maximaal 60 tot 80 gram per 100 kg lichaamsgewicht per dag. Week het tot een slobber en bekijk de video 'Wat geef je dan wél?' voor geschikte opties. Nieuwe voeding opbouwen gedurende 7-10 dagen.
                - generic [ref=f2e773] [cursor=pointer]:
