                    - generic [ref=f2e778]: Vervang door rozenbottel, hennep bite of komkommer
                - generic [ref=f2e781] [cursor=pointer]:
                  - checkbox "Geen gehakseld ruwvoer (fibermix) selecteren" [ref=f2e782]
                  - generic [ref=f2e783]:
                    - generic [ref=f2e784]: Geen gehakseld ruwvoer (fibermix)
                    - generic [ref=f2e786]: Te kort om te kauwen, verstoort de dikke darm
                - generic [ref=f2e789] [cursor=pointer]:
                  - checkbox "Graszaadhooi beperken selecteren" [ref=f2e790]
                  - generic [ref=f2e791]:
                    - generic [ref=f2e792]: Graszaadhooi beperken
                    - generic [ref=f2e794]: "Laat graszaadhooi maximaal een derde van het totale ruwvoerrantsoen vormen, omdat het eenzijdiger is dan passend weidehooi. Ga er niet automatisch van uit dat graszaadhooi suikerarm is: laat ook dit analyseren en beoordeel het binnen het volledige rantsoen."
                - generic [ref=f2e797] [cursor=pointer]:
                  - checkbox "Ruwvoer als basis selecteren" [ref=f2e798]
                  - generic [ref=f2e799]:
                    - generic [ref=f2e800]: Ruwvoer als basis
                    - generic [ref=f2e802]: Laat het rantsoen hoofdzakelijk bestaan uit onverpakt hooi (uit touwtjes). Geef 2 tot 3 kg hooi per 100 kg (gewenst) lichaamsgewicht en periodes zonder ruwvoer >2u (inclusief de nacht).
                - generic [ref=f2e805] [cursor=pointer]:
                  - checkbox "Slowfeeders met kleine mazen selecteren" [ref=f2e806]
                  - generic [ref=f2e807]:
                    - generic [ref=f2e808]: Slowfeeders met kleine mazen
                    - generic [ref=f2e810]: 3x3 cm, verlengt de eettijd · geleidelijk opbouwen als paard het niet gewend is, stress te allen tijde voorkomen
                - generic [ref=f2e813] [cursor=pointer]:
                  - checkbox "Stoppen met huidige bijvoeding selecteren" [ref=f2e814]
                  - generic [ref=f2e815]:
                    - generic [ref=f2e816]: Stoppen met huidige bijvoeding
                    - generic [ref=f2e818]: Afbouwen gedurende 7-10 dagen.
                - generic [ref=f2e821] [cursor=pointer]:
                  - checkbox "Stoppen met voordroog selecteren" [ref=f2e822]
                  - generic [ref=f2e823]:
                    - generic [ref=f2e824]: Stoppen met voordroog
                    - generic [ref=f2e826]: Vervang voordroog zo snel mogelijk door onverpakt schimmelvrij hooi. Voordroog wordt geconserveerd door fermentatie en bevat melkzuurbacteriën en melkzuren die de zuurgraad en bacteriële balans in de darmen kunnen verstoren. Droger voordroog kan daarnaast ongemerkt meer schimmels, gisten en ongewenste bacteriën bevatten.
                - generic [ref=f2e829] [cursor=pointer]:
                  - checkbox "Vers groen ter vrije selectie selecteren" [ref=f2e830]
                  - generic [ref=f2e831]:
                    - generic [ref=f2e832]: Vers groen ter vrije selectie
                    - generic [ref=f2e834]: Wilgentakken, kleefkruid, weegbree, paardenbloem, brandnetel
                - generic [ref=f2e837] [cursor=pointer]:
                  - checkbox "Voerwissels geleidelijk doorvoeren selecteren" [ref=f2e838]
                  - generic [ref=f2e839]:
                    - generic [ref=f2e840]: Voerwissels geleidelijk doorvoeren
                    - generic [ref=f2e842]: Oud en nieuw voer mengen over 7 tot 10 dagen
                - generic [ref=f2e845] [cursor=pointer]:
                  - checkbox "Waterkwaliteit controleren selecteren" [ref=f2e846]
                  - generic [ref=f2e847]:
                    - generic [ref=f2e848]: Waterkwaliteit controleren
                    - generic [ref=f2e850]: Laat de waterkwaliteit regelmatig onderzoeken wanneer het paard regenwater, slootwater of grondwater drinkt. Dit water kan bacteriën, algen, zware metalen, landbouwstoffen of een ongunstige mineralensamenstelling bevatten, ook wanneer het helder oogt en normaal ruikt. Bekijk voor meer uitleg de gratis video over waterkwaliteit in de bibliotheek.
                - generic [ref=f2e853] [cursor=pointer]:
                  - checkbox "Zoutsteen ter vrije beschikking selecteren" [ref=f2e854]
                  - generic [ref=f2e855]:
                    - generic [ref=f2e856]: Zoutsteen ter vrije beschikking
                    - generic [ref=f2e858]: "Bied een zoutsteen zonder melasse en organisch selenium aan, bijvoorbeeld een Himalaya-zoutsteen of PN-steen. Controleer altijd de samenstelling: ook andere zoutstenen kunnen geschikt zijn. De steen is bedoeld om af en toe aan te likken en hoort niet in korte tijd volledig te worden opgegeten."
                - generic [ref=f2e861] [cursor=pointer]:
                  - checkbox "Zuivere balancer geven selecteren" [ref=f2e862]
                  - generic [ref=f2e863]:
                    - generic [ref=f2e864]: Zuivere balancer geven
                    - generic [ref=f2e866]: Vul het ruwvoer dagelijks aan met een meukvrije balancer met anorganische mineralen. Geef de dosering die past bij het lichaamsgewicht en het gekozen product. Bekijk voor meer uitleg de video "wat dan wel" in de bibliotheek.
