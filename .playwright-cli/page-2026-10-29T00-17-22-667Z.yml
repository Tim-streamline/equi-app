            - strong [ref=f3e133]: Balancer
            - text: "· versie 2 · Actief: Vanaf 20% suiker + zetmeel: maximaal 0/10."
          - listitem [ref=f3e134]:
            - strong [ref=f3e135]: Standaardvoer
            - text: "· versie 2 · Actief: Vanaf 20% suiker + zetmeel: maximaal 0/10."
